<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum — Satranç Koçu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .kart { background: #16213e; border: 1px solid #0f3460; border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 400px; }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo h1 { font-size: 1.8rem; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo p { color: #888; font-size: 0.85rem; margin-top: 4px; }
        label { display: block; font-size: 0.82rem; color: #aaa; margin-bottom: 6px; margin-top: 16px; }
        input { width: 100%; padding: 11px 14px; background: #0f3460; border: 1px solid #1a4a80; border-radius: 8px; color: #eee; font-size: 0.95rem; outline: none; }
        .btn { width: 100%; margin-top: 20px; padding: 13px; background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 10px; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .mesaj { margin-top: 14px; padding: 12px; background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); border-radius: 8px; color: #4ade80; font-size: 0.88rem; }
        .hata { margin-top: 14px; padding: 12px; background: rgba(220,50,50,0.12); border: 1px solid rgba(220,50,50,0.3); border-radius: 8px; color: #f88; font-size: 0.88rem; }
        .alt-link { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #888; }
        .alt-link a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
<div class="kart">
    <div class="logo">
        <h1>♟️ Satranç Koçu</h1>
        <p>Şifreni sıfırla</p>
    </div>
    {% if mesaj %}
        <div class="mesaj">✅ {{ mesaj }}</div>
    {% elif hata %}
        <div class="hata">❌ {{ hata }}</div>
    {% else %}
    <form method="POST">
        <label>Email adresin</label>
        <input type="email" name="email" placeholder="ornek@email.com" required autofocus>
        <button class="btn">Sıfırlama Linki Gönder</button>
    </form>
    {% endif %}
    <div class="alt-link"><a href="/giris">← Giriş sayfasına dön</a></div>
</div>
</body>
</html>
