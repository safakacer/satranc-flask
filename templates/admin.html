<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel — Satranç Koçu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 32px 16px; }
        h1 { font-size: 1.5rem; margin-bottom: 24px; color: #667eea; }
        .bos { color: #888; text-align: center; padding: 40px; background: #16213e; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; background: #16213e; border-radius: 12px; overflow: hidden; }
        th { background: #0f3460; padding: 12px 16px; text-align: left; font-size: 0.82rem; color: #aaa; font-weight: 600; }
        td { padding: 14px 16px; border-bottom: 1px solid #0f3460; font-size: 0.9rem; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        .not { color: #aaa; font-size: 0.82rem; max-width: 200px; }
        .tarih { color: #666; font-size: 0.78rem; }
        .onayla-btn {
            padding: 7px 16px; background: linear-gradient(135deg, #4ade80, #22c55e);
            border: none; border-radius: 8px; color: #111; font-weight: 700;
            cursor: pointer; font-size: 0.85rem; white-space: nowrap;
        }
        .onayla-btn:hover { opacity: 0.85; }
        .sayac { display: inline-block; background: #f59e0b; color: #111; border-radius: 20px; padding: 2px 10px; font-size: 0.78rem; font-weight: 700; margin-left: 8px; }
        .cikis { float: right; color: #f88; text-decoration: none; font-size: 0.85rem; }
    </style>
</head>
<body>
    <h1>🛡️ Admin Panel <span class="sayac">{{ odemeler|length }} bekliyor</span>
        <a class="cikis" href="/cikis">Çıkış</a>
    </h1>

    {% if odemeler %}
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Email</th>
                <th>Not / Dekont</th>
                <th>Tarih</th>
                <th>İşlem</th>
            </tr>
        </thead>
        <tbody>
        {% for odeme in odemeler %}
            <tr>
                <td>{{ odeme[0] }}</td>
                <td>{{ odeme[1] }}</td>
                <td class="not">{{ odeme[2] or '—' }}</td>
                <td class="tarih">{{ odeme[3][:16] }}</td>
                <td>
                    <form method="POST" action="/admin/onayla/{{ odeme[0] }}">
                        <button class="onayla-btn">✅ Onayla</button>
                    </form>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    {% else %}
    <div class="bos">🎉 Bekleyen ödeme yok.</div>
    {% endif %}
</body>
</html>
